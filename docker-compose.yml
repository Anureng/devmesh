services:
  db:
    image: postgres:16-alpine
    container_name: facedet_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facedet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facedet}
      POSTGRES_DB: ${POSTGRES_DB:-facedetdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facedet} -d ${POSTGRES_DB:-facedetdb}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: facedet_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: facedet_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
